version: '3'

services:
  # Development service
  app-dev:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm start

  # Production build service (for testing production build locally)
  app-prod:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"